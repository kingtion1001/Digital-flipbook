<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Artbook — Your Story, Bound</title>

<!--
  =====================================================================
  ABOUT THIS FILE
  =====================================================================
  This is a self-contained, single-file flipbook website:
    - HTML structure  -> below in <body>
    - CSS styling      -> below in <style>
    - JS behavior/data -> below in <script>, near the bottom

  IMPORTANT — CONTENT IS LOCKED FOR VISITORS.
  Nobody viewing the page in a browser can change the title, the
  owner's name, the signature/logo, or any page's photo or caption.
  There is no upload button, no file picker, and no editable text
  anywhere in the rendered page. The ONLY way to change any of that
  content is to edit the CONFIG object inside the <script> tag below
  and re-save/re-deploy this file.

  Jump to "STEP 1: EDIT THIS CONFIG" further down to change content.
  =====================================================================
-->

<!-- Google Fonts used throughout the design (display serif, UI sans, handwriting script) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">

<style>
  /* ===================================================================
     DESIGN TOKENS
     Central color palette so the whole look can be re-themed from
     one place. Edit these hex values to change the color scheme.
     =================================================================== */
  :root{
    --ink-900:#0E1224;      /* darkest background */
    --ink-800:#171F3B;      /* mid background */
    --ink-700:#232C52;      /* lightest background / glow */
    --paper:#FBF7EE;        /* page paper color */
    --paper-2:#F3ECDD;      /* photo-slot paper (slightly darker) */
    --paper-shadow:#E4D9BF; /* paper border/shadow tint */
    --gold:#C9A24B;         /* accent gold (hover/active) */
    --gold-soft:#E7CE93;    /* accent gold (soft/text) */
    --gold-dim:#8C7038;     /* accent gold (dim/borders) */
    --teal:#3E7C73;         /* secondary accent */
    --teal-deep:#1F473F;    /* cover gradient */
    --ink-text:#2B2418;     /* text printed on paper */
    --ink-text-soft:#6B6250;/* muted text on paper */
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(1100px 700px at 50% -10%, var(--ink-700) 0%, var(--ink-800) 45%, var(--ink-900) 100%);
    font-family:'Inter',sans-serif;
    color:var(--paper);
    overflow-x:hidden;
    position:relative;
  }

  /* Soft ambient glow blobs drifting slowly in the background */
  body::before, body::after{
    content:'';
    position:fixed;
    border-radius:50%;
    filter:blur(90px);
    opacity:.35;
    pointer-events:none;
    z-index:0;
  }
  body::before{
    width:520px;height:520px;
    background:var(--teal);
    top:-160px;left:-160px;
    animation:drift1 22s ease-in-out infinite alternate;
  }
  body::after{
    width:460px;height:460px;
    background:var(--gold-dim);
    bottom:-160px;right:-140px;
    animation:drift2 26s ease-in-out infinite alternate;
  }
  @keyframes drift1{ to{ transform:translate(60px,40px); } }
  @keyframes drift2{ to{ transform:translate(-50px,-30px); } }

  .stage{
    position:relative;
    z-index:1;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:clamp(16px,3vw,28px);
    padding:clamp(20px,4vw,40px) 16px 28px;
  }

  /* ---------- header / title (read-only, filled from CONFIG.bookTitle) ---------- */
  .brand{ text-align:center; }
  .brand .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:.72rem;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--gold-soft);
    font-weight:600;
    margin-bottom:6px;
  }
  .brand .eyebrow::before,.brand .eyebrow::after{
    content:'';
    width:18px;height:1px;
    background:var(--gold-dim);
  }
  .brand h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(1.5rem,3.4vw,2.1rem);
    margin:0;
    letter-spacing:.01em;
    color:var(--paper);
    /* Note: no contenteditable / outline here — this text is static,
       set once by JS from CONFIG.bookTitle and not editable by visitors. */
  }
  .brand .hint{
    margin:8px 0 0;
    font-size:.82rem;
    color:rgba(251,247,238,.45);
    font-weight:400;
  }

  /* ===================================================================
     THE BOOK — 3D flip mechanics
     =================================================================== */
  .book-wrapper{
    width:min(94vw,880px);
    aspect-ratio:8/5;
    perspective:2600px;
    position:relative;
  }
  .book{
    position:relative;
    width:100%;
    height:100%;
    transform-style:preserve-3d;
  }
  .book-shadow{
    position:absolute;
    left:6%;right:6%;
    bottom:-26px;
    height:34px;
    background:radial-gradient(ellipse at center, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 72%);
    filter:blur(4px);
    z-index:0;
  }
  .spine{
    position:absolute;
    top:2%; bottom:2%; left:50%;
    width:22px;
    margin-left:-11px;
    background:linear-gradient(90deg, rgba(0,0,0,.32), rgba(0,0,0,.05) 30%, rgba(0,0,0,.05) 70%, rgba(0,0,0,.32));
    z-index:400;
    pointer-events:none;
    border-radius:3px;
  }

  /* A "leaf" is one physical sheet of paper with a front face and a back
     face. It occupies the RIGHT half of the book when unflipped, and
     rotates -180deg around its spine-side edge to move to the LEFT half
     when flipped. This is what produces the realistic page-turn. */
  .leaf{
    position:absolute;
    top:0; left:50%;
    width:50%; height:100%;
    transform-origin:left center;
    transform-style:preserve-3d;
    transition:transform .85s cubic-bezier(.63,.04,.36,1);
  }
  .face{
    position:absolute; inset:0;
    background:var(--paper);
    backface-visibility:hidden; /* hides the reverse side until it rotates into view */
    overflow:hidden;
    box-shadow:0 2px 18px rgba(0,0,0,.28);
  }
  .face.front{
    border-radius:5px 14px 14px 5px;
    box-shadow:inset -10px 0 20px -16px rgba(0,0,0,.5), 0 2px 18px rgba(0,0,0,.28);
  }
  .face.back{
    transform:rotateY(180deg); /* pre-flipped so its content reads correctly once the parent leaf rotates */
    border-radius:14px 5px 5px 14px;
    box-shadow:inset 10px 0 20px -16px rgba(0,0,0,.5), 0 2px 18px rgba(0,0,0,.28);
  }
  .face::after{ /* subtle paper sheen highlight, purely decorative */
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(115deg, rgba(255,255,255,.5) 0%, rgba(255,255,255,0) 18%, rgba(255,255,255,0) 82%, rgba(0,0,0,.03) 100%);
    pointer-events:none;
  }

  /* Decorative "inside cover" pages shown only when a pile is empty
     (before the first page turn, and after the last page turn). */
  .filler{
    position:absolute; top:0; width:50%; height:100%;
    background:var(--paper);
    z-index:1;
  }
  .filler.left{ left:0; border-radius:14px 5px 5px 14px; box-shadow:inset 10px 0 20px -16px rgba(0,0,0,.5);}
  .filler.right{ left:50%; border-radius:5px 14px 14px 5px; box-shadow:inset -10px 0 20px -16px rgba(0,0,0,.5);}
  .filler-inner{
    height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:8%;
    text-align:center;
  }
  .filler .line{
    font-family:'Caveat',cursive;
    font-size:clamp(1rem,2.2vw,1.35rem);
    color:var(--ink-text-soft);
  }
  .filler .owner-name{
    /* Static text filled from CONFIG.ownerName — not an input, not editable */
    width:70%;
    border-bottom:1px dashed var(--paper-shadow);
    margin:10px auto 0;
    min-height:1.4em;
    font-family:'Caveat',cursive;
    font-size:clamp(1.1rem,2.4vw,1.5rem);
    color:var(--ink-text);
    text-align:center;
  }
  .filler .mark{
    width:34px;height:34px;border:1.5px solid var(--gold-dim);border-radius:50%;
    display:flex;align-items:center;justify-content:center;color:var(--gold-dim);font-family:'Fraunces',serif;font-size:.9rem;
    margin-top:10px;
  }

  /* ---------- content page layout ----------
     The photo is full-bleed (position:absolute; inset:0), so page-inner
     is just a positioning context — no padding or flex needed. */
  .page-inner{
    height:100%;
    position:relative;
  }
  /* Page number now floats as a small pill over the top corner of the
     full-bleed photo, so it stays legible against any image. */
  .page-number{
    position:absolute;
    top:12px;
    font-family:'Fraunces',serif;
    font-size:.7rem;
    letter-spacing:.05em;
    color:var(--gold-soft);
    background:rgba(14,18,36,.55);
    padding:3px 9px;
    border-radius:20px;
    backdrop-filter:blur(3px);
    z-index:2;
  }
  .face.front .page-number{ left:12px; }
  .face.back .page-number{ right:12px; }

  /* Photo fills the ENTIRE page face, edge to edge (the face element
     itself clips it to the page's rounded corners via overflow:hidden).
     Purely a DISPLAY element — renders whatever path is set in
     CONFIG.pages[i].image. It is NOT clickable and has no upload
     affordance; visitors cannot change what is shown here. */
  .photo-slot{
    position:absolute;
    inset:0;
    background:var(--paper-2);
    background-size:cover;
    background-position:center;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  /* Shown only when a page has no image configured — a quiet reminder
     for the developer, not an interactive control. */
  .photo-placeholder{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    color:var(--ink-text-soft);
    pointer-events:none;
    padding:10px;
    text-align:center;
  }
  .photo-placeholder svg{ width:26px;height:26px; opacity:.5; }
  .photo-placeholder span{ font-size:.7rem; font-weight:500; letter-spacing:.02em; }

  /* Caption sits as an overlay strip along the bottom of the photo,
     on a dark gradient scrim so the handwritten text stays readable
     over any image. Static text pulled from CONFIG.pages[i].caption —
     no contenteditable attribute anywhere, visitors cannot change it.
     If a page has no caption configured, the element isn't rendered
     at all (see contentFaceHTML in the script), so no empty bar shows. */
  .caption{
    position:absolute;
    left:0; right:0; bottom:0;
    padding:22px 16px 12px;
    background:linear-gradient(to top, rgba(10,12,20,.62) 0%, rgba(10,12,20,0) 100%);
    font-family:'Caveat',cursive;
    font-size:clamp(1rem,2.3vw,1.3rem);
    color:#FBF7EE;
    text-shadow:0 1px 3px rgba(0,0,0,.4);
    line-height:1.25;
    max-height:3.4em;
    overflow:hidden;
    z-index:2;
  }

  /* Corner "turn zones" — the only interactive control on each page.
     Clicking/tapping here (or the prev/next buttons, or swiping, or
     the arrow keys) turns the page. This never touches content. */
  .turn-zone{
    position:absolute; top:0; bottom:0; width:15%;
    display:flex; align-items:center;
    cursor:pointer;
    z-index:5;
    user-select:none;
  }
  .turn-zone.next{ right:0; justify-content:flex-end; padding-right:6px;}
  .turn-zone.prev{ left:0; justify-content:flex-start; padding-left:6px;}
  .turn-zone .chevron{
    opacity:0; transform:scale(.7);
    transition:opacity .2s ease, transform .2s ease;
    color:var(--gold-dim);
    font-size:1.3rem;
  }
  .turn-zone:hover .chevron{ opacity:1; transform:scale(1); }
  .fold{
    position:absolute; width:26px; height:26px; pointer-events:none;
    opacity:.55;
  }
  .face.front .fold{
    right:0; bottom:0;
    background:linear-gradient(135deg, transparent 50%, rgba(0,0,0,.10) 50.5%, rgba(0,0,0,.16) 100%);
    border-radius:0 0 5px 0;
  }
  .face.back .fold{
    left:0; bottom:0;
    background:linear-gradient(225deg, transparent 50%, rgba(0,0,0,.10) 50.5%, rgba(0,0,0,.16) 100%);
    border-radius:0 0 0 5px;
  }

  /* ---------- cover ---------- */
  .cover-face{
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,.035) 0 2px, transparent 2px 5px),
      linear-gradient(160deg, var(--teal-deep) 0%, var(--ink-800) 55%, var(--ink-900) 100%);
  }
  .cover-inner{
    height:100%;
    margin:14px;
    border:1px solid rgba(201,162,75,.55);
    border-radius:10px;
    box-shadow:inset 0 0 0 4px rgba(201,162,75,.08);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    padding:8% 9%;
    position:relative;
  }
  .cover-inner .eyebrow{
    font-size:.68rem; letter-spacing:.24em; text-transform:uppercase;
    color:var(--gold-soft); font-weight:600; opacity:.85; margin-bottom:10px;
  }
  .cover-title{
    /* Static, from CONFIG.coverTitle */
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(1.15rem,3.4vw,1.9rem);
    color:var(--paper);
    margin:0 0 6px;
    max-width:100%;
  }
  .cover-sub{
    /* Static, from CONFIG.coverSubtitle */
    font-family:'Caveat',cursive;
    font-size:clamp(.95rem,2vw,1.15rem);
    color:var(--gold-soft);
    margin:0 0 6%;
  }
  /* Signature/logo image: display-only, filled from CONFIG.signatureImage.
     No placeholder box, no border, no icon — if no image is configured
     this element is simply not rendered at all (see coverFaceHTML in
     the script), so the cover just shows the title/subtitle centered. */
  .signature-slot{
    width:78%;
    max-width:230px;
    aspect-ratio:2.4/1;
    background-size:contain;
    background-repeat:no-repeat;
    background-position:center;
  }

  .cover-face .fold, .backcover-face .fold{ opacity:.35; }
  .backcover-face{
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,.03) 0 2px, transparent 2px 5px),
      linear-gradient(200deg, var(--ink-800) 0%, var(--ink-900) 100%);
  }
  .backcover-inner{
    height:100%; margin:14px; border:1px solid rgba(201,162,75,.4); border-radius:10px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    gap:10px;
  }
  .backcover-inner .ring{
    width:46px;height:46px;border:1.5px solid var(--gold-dim);border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif; color:var(--gold-soft); font-size:1rem;
  }
  .backcover-inner p{
    /* Static, from CONFIG.backCoverText */
    font-family:'Caveat',cursive; font-size:1.1rem; color:rgba(251,247,238,.65); margin:0;
  }

  /* ===================================================================
     NAVIGATION CONTROLS (page turning only — no content editing)
     =================================================================== */
  .controls{
    display:flex; align-items:center; gap:18px;
    z-index:1;
  }
  .ctrl-btn{
    width:42px;height:42px;border-radius:50%;
    background:rgba(251,247,238,.06);
    border:1px solid rgba(201,162,75,.35);
    color:var(--gold-soft);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:1.1rem;
    transition:background .2s ease, transform .15s ease, opacity .2s ease;
  }
  .ctrl-btn:hover:not(:disabled){ background:rgba(201,162,75,.18); transform:translateY(-1px); }
  .ctrl-btn:disabled{ opacity:.25; cursor:default; }
  .counter{
    min-width:150px;
    text-align:center;
    font-size:.85rem;
    letter-spacing:.04em;
    color:rgba(251,247,238,.75);
    font-variant-numeric:tabular-nums;
  }
  .progress{
    width:min(94vw,420px);
    height:3px;
    background:rgba(251,247,238,.12);
    border-radius:3px;
    overflow:hidden;
    margin-top:-6px;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg,var(--gold-dim),var(--gold));
    width:0%;
    transition:width .5s ease;
  }

  @media (prefers-reduced-motion: reduce){
    .leaf{ transition:transform .05s linear; }
  }

  @media (max-width:520px){
    .turn-zone{ width:20%; }
    .caption{ max-height:2.4em; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="brand">
    <div class="eyebrow">A digital artbook</div>
    <!-- Title text is injected by JS from CONFIG.bookTitle. Static, not editable. -->
    <h1 id="bookTitle"></h1>
    <p class="hint">Tap a corner to turn the page</p>
  </div>

  <div class="book-wrapper">
    <div class="book" id="book">
      <div class="spine"></div>
      <div class="book-shadow"></div>

      <!-- Inside-cover filler pages (shown only when the book is fully
           closed on that side). Owner name comes from CONFIG.ownerName. -->
      <div class="filler left" id="fillerLeft">
        <div class="filler-inner">
          <div class="line">This artbook belongs to</div>
          <div class="owner-name" id="ownerName"></div>
        </div>
      </div>
      <div class="filler right" id="fillerRight">
        <div class="filler-inner">
          <div class="mark">✦</div>
          <div class="line">More to come</div>
        </div>
      </div>

      <!-- Every page "leaf" (cover, 20 content pages, back cover) is
           generated by JS from the CONFIG object below — nothing here
           is hand-written per page and nothing is user-editable. -->
    </div>
  </div>

  <div class="progress"><div class="progress-fill" id="progressFill"></div></div>

  <div class="controls">
    <button class="ctrl-btn" id="prevBtn" aria-label="Previous page">‹</button>
    <div class="counter" id="counter">Cover</div>
    <button class="ctrl-btn" id="nextBtn" aria-label="Next page">›</button>
  </div>
</div>

<script>
/* =======================================================================
   STEP 1: EDIT THIS CONFIG — this is the ONLY place content is set.
   =======================================================================
   Everything a visitor sees (title, owner name, signature/logo image,
   and every page's photo + caption) comes from this single object.
   There is no UI for anyone to change these values in the browser —
   to update the notebook, edit the values below and re-save this file
   (or re-deploy it to your host).

   IMAGES: set "image" to a URL or a relative path to a file sitting
   next to this HTML file, e.g. "images/photo-01.jpg". You can also use
   a fully-qualified URL, e.g. "https://example.com/photo.jpg".
   Leave an "image" value as an empty string "" to show an empty
   placeholder box (useful while you're still collecting photos).

   TOTAL_PAGES must match the number of entries in the "pages" array.
   ======================================================================= */
const CONFIG = {
  // Text shown above the book
  bookTitle: "Tion's Artbook",

  // Text shown on the inside front cover, next to "This artbook belongs to"
  ownerName: "Tion",

  // Cover page text
  coverTitle: "My Story Begins Here",
  coverSubtitle: "a keepsake, page by page",

  // Cover signature / logo image. Leave "" for an empty placeholder box.
  signatureImage: "", // e.g. "images/signature.png"

  // Text shown on the inside back cover
  backCoverText: "20 pages, kept safe",

  // Exactly 20 content pages. Each needs an "image" (path/URL or "" for
  // empty) and a "caption" (plain text, can be left as "").
  pages: [
    { image: "images/img_2625.png", caption: "" },   // page 1
    { image: "images/img_2773.png", caption: "" },   // page 2
    { image: "images/img_2951.png", caption: "" },   // page 3
    { image: "images/img_3153.png", caption: "" },   // page 4
    { image: "images/img_3149.png", caption: "" },   // page 5
    { image: "images/img_3738.png", caption: "" },   // page 6
    { image: "images/img_2437.jpg.jpeg", caption: "" },   // page 7
    { image: "images/img_3883.png", caption: "" },   // page 8
    { image: "images/img_3061.png", caption: "" },   // page 9
    { image: "images/img_2773.png", caption: "" },   // page 10
    { image: "images/img_2467.jpg.jpeg", caption: "" },   // page 11
    { image: "images/img_3624.png", caption: "" },   // page 12
    { image: "images/img_3313.png", caption: "" },   // page 13
    { image: "images/img_2433.jpg.jpeg", caption: "" },   // page 14
    { image: "images/img_2388.png", caption: "" },   // page 15
    { image: "images/img_4001.jpg.jpeg", caption: "" },   // page 16
    { image: "images/img_3960.png", caption: "" },   // page 17
    { image: "images/img_2436.jpg.jpeg", caption: "" },   // page 18
    { image: "images/img_2573.png", caption: "" },   // page 19
    { image: "images/img_2699.png", caption: "" }    // page 20
  ]
};
/* ===================== END OF EDITABLE CONFIG ========================= */


/* =======================================================================
   STEP 2: EVERYTHING BELOW THIS LINE IS APPLICATION LOGIC.
   You shouldn't need to touch this to change content — only edit it if
   you want to change how the book behaves (e.g. animation speed,
   number of pages, navigation controls).
   ======================================================================= */
(function(){
  'use strict';

  const TOTAL_PAGES = CONFIG.pages.length;

  // Basic safety check so a miscounted CONFIG.pages array fails loudly
  // in the console instead of silently rendering something broken.
  if(TOTAL_PAGES < 1){
    console.error('CONFIG.pages must contain at least one page.');
  }

  // ---- grab DOM references ----
  const book = document.getElementById('book');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const counterEl = document.getElementById('counter');
  const progressFill = document.getElementById('progressFill');
  const fillerLeft = document.getElementById('fillerLeft');
  const fillerRight = document.getElementById('fillerRight');

  // ---- fill in the static, non-editable text from CONFIG ----
  document.getElementById('bookTitle').textContent = CONFIG.bookTitle;
  document.getElementById('ownerName').textContent = CONFIG.ownerName;
  document.title = CONFIG.bookTitle;

  // Small inline icon shown as a placeholder on content pages that have
  // no image configured yet.
  const imgIconSVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="M21 16l-5.5-5.5L9 17"/></svg>';

  /* ---------------------------------------------------------------------
     Build the "leaf" data model from CONFIG.pages.
     A physical book is made of folded SHEETS, not single pages: each
     sheet (leaf) has a front side and a back side. So with N content
     pages we need roughly N/2 leaves, plus one leaf for the cover
     (front = cover, back = content page 1) and the last leaf's back
     becomes the back cover if N is even.
     --------------------------------------------------------------------- */
  const leaves = [];
  leaves.push({ front:{type:'cover'}, back:{type:'content', num:1} });
  let n = 2;
  while(n <= TOTAL_PAGES){
    const frontNum = n, backNum = n + 1;
    if(backNum <= TOTAL_PAGES){
      leaves.push({ front:{type:'content', num:frontNum}, back:{type:'content', num:backNum} });
    } else {
      leaves.push({ front:{type:'content', num:frontNum}, back:{type:'backcover'} });
    }
    n += 2;
  }

  // Escapes text before it's inserted via innerHTML, so a stray "<" or
  // "&" in a caption can never break the page markup.
  function escapeHTML(str){
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  // Builds the markup for one content page face, reading its image and
  // caption straight from CONFIG.pages (page numbers are 1-indexed).
  // The photo fills the whole page; the caption overlay is only added
  // when a caption is actually configured, so empty pages stay clean.
  function contentFaceHTML(num, side){
    const data = CONFIG.pages[num - 1] || { image:'', caption:'' };
    const hasImage = !!data.image;
    const bgStyle = hasImage ? ` style="background-image:url('${escapeHTML(data.image)}')"` : '';
    const placeholder = hasImage ? '' : `<div class="photo-placeholder">${imgIconSVG}<span>No image set</span></div>`;
    const captionHTML = data.caption ? `<div class="caption">${escapeHTML(data.caption)}</div>` : '';
    return `
      <div class="page-inner">
        <div class="photo-slot"${bgStyle}>${placeholder}</div>
        <div class="page-number">${String(num).padStart(2,'0')}</div>
        ${captionHTML}
        <div class="turn-zone ${side==='front'?'next':'prev'}"><span class="chevron">${side==='front'?'›':'‹'}</span></div>
        <div class="fold"></div>
      </div>`;
  }

  // Builds the cover face, reading title/subtitle/signature from CONFIG.
  // The signature/logo element is only rendered at all when
  // CONFIG.signatureImage is set — no placeholder box is ever shown.
  function coverFaceHTML(){
    const hasSig = !!CONFIG.signatureImage;
    const signatureHTML = hasSig
      ? `<div class="signature-slot" style="background-image:url('${escapeHTML(CONFIG.signatureImage)}')"></div>`
      : '';
    return `
      <div class="cover-inner">
        <div class="eyebrow">Est. ${new Date().getFullYear()}</div>
        <h2 class="cover-title">${escapeHTML(CONFIG.coverTitle)}</h2>
        <p class="cover-sub">${escapeHTML(CONFIG.coverSubtitle)}</p>
        ${signatureHTML}
      </div>
      <div class="turn-zone next"><span class="chevron">›</span></div>
      <div class="fold"></div>`;
  }

  // Builds the back cover face.
  function backcoverFaceHTML(){
    return `
      <div class="backcover-inner">
        <div class="ring">✦</div>
        <p>${escapeHTML(CONFIG.backCoverText)}</p>
      </div>
      <div class="turn-zone prev"><span class="chevron">‹</span></div>
      <div class="fold"></div>`;
  }

  function buildFace(data, side){
    if(data.type === 'cover') return coverFaceHTML();
    if(data.type === 'backcover') return backcoverFaceHTML();
    return contentFaceHTML(data.num, side);
  }

  // ---- render every leaf into the DOM (runs once, on page load) ----
  const leafEls = leaves.map((leaf, i) => {
    const el = document.createElement('div');
    el.className = 'leaf';
    el.dataset.index = i;

    const front = document.createElement('div');
    front.className = 'face front' + (leaf.front.type==='cover' ? ' cover-face' : leaf.front.type==='backcover' ? ' backcover-face' : '');
    front.innerHTML = buildFace(leaf.front, 'front');

    const back = document.createElement('div');
    back.className = 'face back' + (leaf.back.type==='cover' ? ' cover-face' : leaf.back.type==='backcover' ? ' backcover-face' : '');
    back.innerHTML = buildFace(leaf.back, 'back');

    el.appendChild(front);
    el.appendChild(back);
    book.appendChild(el);
    return el;
  });

  /* ---------------------------------------------------------------------
     Navigation state & rendering.
     `pos` = how many leaves are currently flipped to the left pile.
     pos === 0        -> book shows the cover
     pos === leaves.length -> book shows the back cover
     --------------------------------------------------------------------- */
  const L = leaves.length;
  let pos = 0;

  function computeZ(i){
    // Flipped leaves stack left-to-right by recency; unflipped leaves
    // stack so the very next page to flip is on top.
    return i < pos ? (i + 2) : (L - i + 2);
  }

  function renderStatic(skipIndex){
    leafEls.forEach((el, i) => {
      if(i === skipIndex) return; // the actively-animating leaf is handled separately
      el.style.transform = i < pos ? 'rotateY(-180deg)' : 'rotateY(0deg)';
      el.style.zIndex = computeZ(i);
    });
    fillerLeft.style.display = pos === 0 ? 'block' : 'none';
    fillerRight.style.display = pos === L ? 'block' : 'none';
  }

  function updateUI(){
    let label;
    if(pos === 0) label = 'Cover';
    else if(pos === L) label = 'Back Cover';
    else {
      const rf = leaves[pos].front;
      label = rf.type === 'content' ? `Page ${rf.num} of ${TOTAL_PAGES}` : `Page ${TOTAL_PAGES} of ${TOTAL_PAGES}`;
    }
    counterEl.textContent = label;
    prevBtn.disabled = pos === 0;
    nextBtn.disabled = pos === L;
    progressFill.style.width = (pos / L * 100).toFixed(1) + '%';
  }

  // Flips the next leaf from the right pile to the left pile, giving it
  // a temporarily elevated z-index so it visually passes OVER both
  // piles mid-animation instead of clipping underneath them.
  function flipForward(){
    if(pos >= L) return;
    const idx = pos;
    const el = leafEls[idx];
    el.style.zIndex = 999;
    pos++;
    renderStatic(idx);
    el.style.transform = 'rotateY(-180deg)';
    el.addEventListener('transitionend', function h(){
      el.style.zIndex = computeZ(idx);
      el.removeEventListener('transitionend', h);
    }, { once:true });
    updateUI();
  }

  function flipBackward(){
    if(pos <= 0) return;
    const idx = pos - 1;
    const el = leafEls[idx];
    el.style.zIndex = 999;
    pos--;
    renderStatic(idx);
    el.style.transform = 'rotateY(0deg)';
    el.addEventListener('transitionend', function h(){
      el.style.zIndex = computeZ(idx);
      el.removeEventListener('transitionend', h);
    }, { once:true });
    updateUI();
  }

  // initial paint
  renderStatic();
  updateUI();

  /* ---------------------------------------------------------------------
     Input handlers — page navigation ONLY. There is intentionally no
     click handler anywhere that opens a file picker, enables text
     editing, or otherwise lets a visitor change content.
     --------------------------------------------------------------------- */

  prevBtn.addEventListener('click', flipBackward);
  nextBtn.addEventListener('click', flipForward);

  // Corner "turn zone" taps/clicks on whichever page is currently on top.
  book.addEventListener('click', (e) => {
    if(e.target.closest('.turn-zone.next')) flipForward();
    else if(e.target.closest('.turn-zone.prev')) flipBackward();
  });

  // Left/Right arrow keys turn pages.
  document.addEventListener('keydown', (e) => {
    if(e.key === 'ArrowRight') flipForward();
    if(e.key === 'ArrowLeft') flipBackward();
  });

  // Touch swipe support (mobile/tablet).
  let touchStartX = 0, touchStartY = 0, touching = false;
  book.addEventListener('touchstart', (e) => {
    const t = e.changedTouches[0];
    touchStartX = t.clientX; touchStartY = t.clientY; touching = true;
  }, { passive:true });
  book.addEventListener('touchend', (e) => {
    if(!touching) return;
    touching = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    // Require a clearly horizontal drag so vertical page scrolling
    // on mobile isn't mistaken for a page turn.
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)){
      if(dx < 0) flipForward(); else flipBackward();
    }
  }, { passive:true });
  book.style.touchAction = 'pan-y';

})();
</script>
</body>
</html>
